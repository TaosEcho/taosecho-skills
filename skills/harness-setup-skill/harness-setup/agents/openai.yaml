display_name: Harness Setup
short_description: Initialize, update, resume, or close long-task harnesses with preflight, activation, verification gates, recovery, and handoff.
default_prompt: |
  Initialize or adjust a harness for this task: run preflight when filesystem access is available, detect candidate state files, project docs, entrypoints, optional learnings, and git status, then choose setup, update, resume, or closeout mode. If the user asks what a harness or Harness Engineering means, answer from references/harness-engineering.md. Prepare the required confirmation covering preflight status, task name, task slug, harness depth, outcome, scope, evidence sources, verification gates, state file, activation decision, entrypoint file, evaluator mode, and recovery. Get user approval or an explicit automatic-default instruction before writes or Hard Stop actions; if any confirmation field changes, re-render the full confirmation before writing. Create or update the state file using exactly one writeback shape for the selected depth, apply the confirmed activation decision, add verification gates with owner/trigger/evidence/status/failure action, write recovery instructions, add runtime graduation pointers when useful, write Phase 0 or closeout results, and stop before phase execution. The executing agent owns later phase work, gate execution, writeback, and maintenance.
